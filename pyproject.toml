[project]
name = "llmtg"
version = "0.1.0"
description = "Model the Gathering: Commander simulation and deck experimentation toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmtg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
